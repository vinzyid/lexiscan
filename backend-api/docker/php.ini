; Konfigurasi PHP untuk backend LexiScan di produksi.
;
; KENAPA BERKAS INI ADA. Endpoint penyederhanaan AI memanggil model LLM yang bisa
; butuh puluhan detik untuk satu halaman penuh. Bila `max_execution_time` server
; dibiarkan di bawaan 30 detik, PHP MEMBUNUH prosesnya di tengah panggilan HTTP —
; pengguna melihat "server error" (500) padahal provider AI-nya sehat dan hanya
; belum selesai menjawab.
;
; Nilai di sini sengaja lebih besar dari AI_TOTAL_TIMEOUT (lihat config/services.php),
; supaya batas waktu datang dari KODE (yang menjawab dengan galat yang rapi dan
; menyisakan waktu untuk fallback), bukan dari PHP yang mematikan prosesnya secara
; mendadak tanpa penjelasan.

; 120 detik: cukup untuk satu panggilan LLM lambat + cadangan + penulisan cache,
; tapi tetap ada batas supaya proses yang benar-benar macet tidak menggantung
; selamanya dan menahan worker.
max_execution_time = 120

; Panggilan HTTP keluar (ke provider LLM) dihitung terpisah dari
; max_execution_time di sebagian setup; disamakan supaya konsisten.
default_socket_timeout = 120

; Beberapa respons LLM cukup besar (ratusan KB JSON); beri ruang di atas bawaan
; 128M yang sempit untuk opcache + tokenizer + payload.
memory_limit = 256M

; Error tetap dicatat ke log, tapi tidak ditampilkan ke klien — aplikasi mobile
; mengharapkan JSON `{"message": ...}`, bukan halaman galat HTML.
display_errors = Off
log_errors = On

; Zona waktu eksplisit supaya cap waktu log & cache konsisten lintas server.
date.timezone = UTC
